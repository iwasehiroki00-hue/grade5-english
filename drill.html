<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小5 英語 復習ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffaf0; --paper:#fff; --ink:#2b2b2b; --muted:#6b6b6b; --line:#f0e4cc;
    --accent:#ff8a3d; --accent-soft:#fff1e6;
    --sub:#3b82f6; --sub-bg:#e3eeff; --vb:#ef4444; --vb-bg:#ffe5e5;
    --ok:#16a34a; --ok-bg:#e3f7e9; --ng:#ef4444; --ng-bg:#ffe5e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
  .en,.e{font-family:Nunito,"M PLUS Rounded 1c",sans-serif}
  header{background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{margin:0;font-size:1.15rem;font-weight:800}
  header a{color:#fff;text-decoration:none;font-size:.85rem;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:999px;white-space:nowrap}
  main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  .screen{display:none}.screen.on{display:block}
  .lead{margin:4px 0 14px;font-size:.95rem;color:var(--muted)}

  /* 単元えらび */
  .units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .unit{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 12px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;min-height:96px;transition:transform .08s}
  .unit:active{transform:scale(.97)}
  .unit .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-family:Nunito;font-weight:800;font-size:.95rem}
  .unit .t{font-weight:800;font-size:1rem;line-height:1.3}
  .unit .s{font-size:.75rem;color:var(--muted)}
  .unit .best{font-size:.75rem;color:var(--ok);font-weight:700}
  .unit .best:empty{display:none}

  /* ドリル */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .top .u{font-weight:800}
  .top .u b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-family:Nunito;font-size:.85rem;margin-right:6px}
  .top .p{font-family:Nunito;font-weight:800;color:var(--muted)}
  .bar{height:8px;background:#f3e9d6;border-radius:999px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px 16px}
  .ja{font-size:1rem;color:var(--ink);margin:0 0 12px;padding:10px 12px;background:var(--accent-soft);border-radius:12px}
  .ja small{display:block;font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:2px}
  .sent{font-family:Nunito,sans-serif;font-size:1.5rem;font-weight:800;line-height:2.2;letter-spacing:.01em}
  .blank{display:inline-block;min-width:3.2em;padding:0 .4em;margin:0 .1em;border-bottom:3px solid #cbbfa6;text-align:center;color:transparent;border-radius:8px 8px 0 0;vertical-align:bottom;line-height:1.5;transition:background .15s}
  .blank.cur{border-color:var(--accent);background:var(--accent-soft);animation:blink 1s infinite}
  .blank.done{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
  .blank .lab{display:block;font-family:"M PLUS Rounded 1c",sans-serif;font-size:.62rem;font-weight:800;color:var(--accent);line-height:1.2;margin-top:2px}
  .blank.done .lab{color:var(--ok)}
  @keyframes blink{0%,100%{border-color:var(--accent)}50%{border-color:#ffd2b3}}
  .ask{margin:14px 0 8px;font-weight:800;font-size:.95rem}
  .ask span{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:1px 10px;margin-right:6px;font-size:.85rem}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ch{font-family:Nunito,sans-serif;font-size:1.25rem;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 8px;min-height:56px;cursor:pointer;color:var(--ink);transition:transform .08s}
  .ch:active{transform:scale(.96)}
  .ch.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng);animation:shake .35s}
  .ch.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .ch:disabled{cursor:default;opacity:.6}
  .ch.ok:disabled,.ch.ng:disabled{opacity:1}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .msg{min-height:1.6em;margin-top:12px;font-weight:800;text-align:center;font-size:1.05rem}
  .msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
  .after{display:none;margin-top:12px;gap:10px}
  .after.on{display:flex}
  .btn{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;flex:1;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.main{background:var(--accent);color:#fff}
  .btn.sub{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .btn.say{flex:0 0 auto;background:var(--sub-bg);color:var(--sub);border:2px solid #cfe0ff}
  .btn.review{background:var(--ok);color:#fff}
  .btn.review[hidden]{display:none}
  .top .q{font:inherit;font-size:.74rem;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .top .p{margin-left:auto}

  /* ドリル中（html.lock / body.lock）: 縦スクロールなしの固定レイアウト。
     戦闘シーンと進み具合を上に固定し、問題カードを残りの高さにぴったり収める */
  html.lock,body.lock{overflow:hidden;height:100%;overscroll-behavior:none}
  body.lock main{padding:8px 12px 6px;height:calc(100vh - var(--hdr,56px));height:calc(100dvh - var(--hdr,56px));display:flex;flex-direction:column;box-sizing:border-box}
  body.lock #drill.on{display:flex;flex-direction:column;flex:1;min-height:0}
  body.lock .top{margin-bottom:4px}
  body.lock .top .u{font-size:.95rem}
  body.lock .bar{margin-bottom:8px;height:6px}
  body.lock .scene{height:148px;margin:0 3px 8px;flex:0 0 auto}
  body.lock .hero{bottom:26px}
  body.lock .mon{bottom:28px}
  body.lock .card{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
  body.lock .ja{margin:0 0 6px;padding:6px 10px;font-size:.92rem;line-height:1.45}
  body.lock .ja small{font-size:.66rem;margin-bottom:0}
  body.lock .sent{font-size:1.3rem;line-height:1.9}
  body.lock .ask{margin:8px 0 6px;font-size:.9rem}
  body.lock .choices{gap:8px}
  body.lock .ch{min-height:48px;padding:9px 6px;font-size:1.15rem}
  body.lock .msg{margin-top:6px;min-height:1.5em;font-size:.95rem}
  body.lock .after{margin-top:6px}
  body.lock .after .btn{padding:11px 14px}
  @media (max-height:700px){
    body.lock .scene{height:124px}
    body.lock .hero{bottom:22px;width:62px;height:74px}
    body.lock .mon{bottom:24px;width:88px;height:88px}
    body.lock .sent{font-size:1.15rem;line-height:1.8}
    body.lock .ch{min-height:42px;font-size:1.05rem}
  }
  @media (max-height:580px){
    body.lock .scene{height:104px}
    body.lock .hero{bottom:18px;width:54px;height:64px}
    body.lock .mon{bottom:20px;width:74px;height:74px}
    body.lock .hud{font-size:.64rem;width:100px}
    body.lock .sent{font-size:1.05rem;line-height:1.7}
    body.lock .ja{font-size:.85rem;padding:4px 8px}
    body.lock .ch{min-height:38px;font-size:1rem;padding:6px 4px}
    body.lock .msg{min-height:1.3em;font-size:.88rem;margin-top:4px}
  }

  /* 結果 */
  .result{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:24px 16px;text-align:center}
  .result .u{font-weight:800;color:var(--muted);font-size:.9rem}
  .score{font-family:Nunito,sans-serif;font-size:4.2rem;font-weight:800;line-height:1.1;color:var(--accent);margin:6px 0 0}
  .score small{font-size:1.4rem;font-family:"M PLUS Rounded 1c",sans-serif;color:var(--ink);margin-left:4px}
  .stars{font-size:2rem;letter-spacing:.1em;margin:4px 0;color:#f5b301}
  .stars .off{opacity:.25}
  .cmt{font-weight:800;font-size:1.15rem;margin:6px 0 4px}
  .detail{font-size:.9rem;color:var(--muted)}
  .newbest{display:inline-block;background:var(--ok-bg);color:var(--ok);font-weight:800;border-radius:999px;padding:2px 12px;font-size:.85rem;margin-top:6px}
  .acts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .acts .btn{font-size:1.05rem;padding:16px}
  .miss{margin-top:18px;text-align:left;font-size:.9rem}
  .miss h3{font-size:.9rem;margin:0 0 6px;color:var(--muted)}
  .miss ul{margin:0;padding-left:18px}
  .miss li{font-family:Nunito,sans-serif;font-weight:700;margin:2px 0}
  .miss li small{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:400;color:var(--muted);margin-left:6px}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti span{position:absolute;top:-40px;animation:fall linear forwards}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:.8}}

  /* ===== RPG（ゆうしゃとモンスター） ===== */
  .lvb{display:inline-block;font-family:Nunito,sans-serif;font-weight:800;font-size:.75rem;background:#1b1b3a;color:#ffd60a;border:2px solid #fff;padding:1px 8px;border-radius:6px;white-space:nowrap;vertical-align:middle;margin-left:6px}
  .status{display:flex;gap:12px;align-items:center;background:#1b1b3a;color:#fff;border:3px solid #fff;outline:3px solid #1b1b3a;border-radius:6px;padding:12px 14px;margin:6px 3px 16px}
  .hm svg{width:100%;height:100%;display:block;overflow:visible}
  .status .hm{flex:0 0 auto;width:60px;height:72px}
  .status .lv{font-weight:800;font-size:1rem;line-height:1.3}
  .status .lv b{font-family:Nunito,sans-serif;color:#ffd60a;font-size:1.35rem}
  .status .sm{font-size:.76rem;opacity:.92;line-height:1.5}
  .xpbar{display:block;height:10px;background:#000;border:2px solid #fff;border-radius:4px;overflow:hidden;margin:4px 0}
  .xpbar b{display:block;height:100%;background:linear-gradient(90deg,#4895ef,#7fdfff);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .zukan{margin:0 3px 16px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
  .zukan summary{font-weight:800;cursor:pointer;font-size:.9rem}
  .zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .zc{text-align:center;font-size:.68rem;font-weight:700;background:#1b1b3a;color:#fff;border-radius:8px;padding:6px 2px}
  .zc svg{width:44px;height:44px;display:block;margin:0 auto 2px}
  .zc.un svg{filter:brightness(0) opacity(.35)}
  .zc .t{display:block;line-height:1.2}
  .zc .l{display:block;font-size:.6rem;opacity:.7}

  .scene{position:relative;height:176px;background:radial-gradient(ellipse at 50% 115%,#2a2a5e 0%,#0e0e24 70%);border:3px solid #fff;outline:3px solid #1b1b3a;border-radius:6px;margin:0 3px 14px;overflow:hidden;user-select:none;--d:150px}
  .scene .ground{position:absolute;left:0;right:0;bottom:30px;height:2px;background:rgba(255,255,255,.15)}
  .hero{position:absolute;left:8%;bottom:34px;width:76px;height:91px;z-index:2}
  .hero svg{width:100%;height:100%;animation:bob 1.4s ease-in-out infinite;overflow:visible}
  .mon{position:absolute;right:7%;bottom:34px;width:108px;height:108px;z-index:1}
  .mon svg{width:100%;height:100%;animation:bob 1.8s ease-in-out infinite .5s;shape-rendering:crispEdges}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hero svg .wpn{transform-box:fill-box;transform-origin:50% 95%}
  .hero svg .wpn.glow{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #ffd60a)}
  .hero.swing svg .wpn{animation:swing .55s ease-in-out}
  @keyframes swing{0%{transform:rotate(0)}30%{transform:rotate(-55deg)}60%{transform:rotate(100deg)}100%{transform:rotate(0)}}
  .hero.lunge{animation:lunge .6s ease-in-out}
  @keyframes lunge{0%{transform:translateX(0)}45%{transform:translateX(var(--d))}100%{transform:translateX(0)}}
  .hero.step{animation:step .55s ease-in-out}
  @keyframes step{0%{transform:translateX(0)}50%{transform:translateX(calc(var(--d) * .3))}100%{transform:translateX(0)}}
  .hero.hurt{animation:hurt .5s}
  @keyframes hurt{0%,100%{transform:translateX(0);filter:none}20%,60%{transform:translateX(-8px);filter:brightness(.5) sepia(1) saturate(8) hue-rotate(-40deg)}40%,80%{transform:translateX(6px);filter:brightness(2)}}
  .mon.appear{animation:appear .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes appear{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
  .mon.hit{animation:mhit .45s}
  @keyframes mhit{0%,100%{transform:translateX(0);filter:none}15%{transform:translateX(10px);filter:brightness(5)}35%{transform:translateX(-6px);filter:brightness(1)}55%{transform:translateX(5px);filter:brightness(5)}75%{transform:translateX(-3px);filter:brightness(1)}}
  .mon.die{animation:mdie .75s ease-in forwards}
  @keyframes mdie{0%{opacity:1;transform:scale(1);filter:brightness(1)}30%{filter:brightness(6)}60%{opacity:.7;transform:scale(1.1,.6) translateY(10px);filter:brightness(1) hue-rotate(90deg)}100%{opacity:0;transform:scale(1.3,.05) translateY(40px)}}
  .mon.atk{animation:matk .5s ease-in-out}
  @keyframes matk{0%{transform:translateX(0)}40%{transform:translateX(calc(var(--d) * -1))}100%{transform:translateX(0)}}
  .scene.shake{animation:shake2 .4s}
  @keyframes shake2{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
  .scene.shake3{animation:shake3 .6s}
  @keyframes shake3{0%,100%{transform:translate(0,0)}10%{transform:translate(-10px,6px)}20%{transform:translate(10px,-6px)}30%{transform:translate(-8px,-5px)}40%{transform:translate(8px,5px)}50%{transform:translate(-6px,3px)}60%{transform:translate(6px,-3px)}80%{transform:translate(-3px,2px)}}
  .fx{position:absolute;inset:0;pointer-events:none;z-index:3}
  .slash{position:absolute;width:110px;height:10px;border-radius:999px;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 12px #fff;animation:slash .32s ease-out forwards;opacity:0}
  @keyframes slash{0%{transform:rotate(var(--r)) scaleX(0);opacity:1}60%{transform:rotate(var(--r)) scaleX(1);opacity:1}100%{transform:rotate(var(--r)) scaleX(1.1);opacity:0}}
  .slash.c2{background:linear-gradient(90deg,transparent,#ffd60a 30%,#fff 70%,transparent);box-shadow:0 0 14px #ffd60a}
  .slash.c3{background:linear-gradient(90deg,transparent,#7fdfff 30%,#fff 70%,transparent);box-shadow:0 0 16px #7fdfff}
  .spark{position:absolute;width:8px;height:8px;background:#ffd60a;box-shadow:0 0 6px #fff;animation:spark .55s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .hittxt{position:absolute;font-weight:800;font-size:1.3rem;color:#fff;-webkit-text-stroke:1px #1b1b3a;text-shadow:2px 2px 0 #1b1b3a;animation:hittxt .7s ease-out forwards;white-space:nowrap}
  @keyframes hittxt{0%{transform:translateY(0) scale(.6);opacity:0}25%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-36px) scale(1);opacity:0}}
  .flash{position:absolute;inset:0;background:#fff;animation:flash .35s ease-out forwards;pointer-events:none}
  .flash.big{position:fixed;z-index:60;background:#fffbe6;animation-duration:.5s}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .bolt{position:absolute;top:0;width:60px;animation:bolt .45s ease-out forwards;filter:drop-shadow(0 0 6px #fff)}
  @keyframes bolt{0%{opacity:0}10%{opacity:1}40%{opacity:.3}55%{opacity:1}100%{opacity:0}}
  .bmsg{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;background:rgba(0,0,0,.55);color:#fff;font-size:.82rem;font-weight:700;min-height:28px;line-height:1.4;border-top:2px solid rgba(255,255,255,.4);z-index:4}
  .hud{position:absolute;left:8px;top:6px;color:#fff;font-size:.72rem;font-weight:800;width:120px;z-index:4}
  .hud .xpbar{height:7px;margin:2px 0 0}
  .hud .xpbar b{transition:none}
  .mname{position:absolute;right:8px;top:6px;color:#fff;font-size:.72rem;font-weight:800;background:rgba(0,0,0,.4);padding:1px 8px;border-radius:4px;z-index:4}
  .mname.sp{background:linear-gradient(90deg,#b8860b,#ffd60a,#fff4c2,#ffd60a,#b8860b);color:#1b1b3a;box-shadow:0 0 10px #ffd60a;font-size:.78rem;animation:glow2 .8s ease-in-out infinite alternate}
  @keyframes glow2{from{box-shadow:0 0 4px #ffd60a}to{box-shadow:0 0 16px #ffd60a}}
  .status .rst{font:inherit;font-size:.7rem;font-weight:700;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:2px 10px;margin-top:6px;cursor:pointer;opacity:.8}
  .status .rst.arm{background:#ef4444;border-color:#fff;opacity:1}

  .xpbox{background:#1b1b3a;color:#fff;border:3px solid #fff;outline:3px solid #1b1b3a;border-radius:6px;padding:12px 14px;margin:16px 3px 4px;text-align:left;display:flex;gap:12px;align-items:center}
  .xpbox .hm{flex:0 0 auto;width:50px;height:60px}
  .xpbox .g{font-weight:800}.xpbox .g b{color:#ffd60a;font-family:Nunito,sans-serif;font-size:1.2rem}
  .xpbox .sm{font-size:.76rem;opacity:.92}

  .lvup{position:fixed;inset:0;background:rgba(0,0,10,.82);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
  .lvup.on{display:flex}
  .lvwin{background:#1b1b3a;color:#fff;border:3px solid #fff;outline:3px solid #1b1b3a;border-radius:8px;padding:22px 20px;max-width:380px;width:100%;text-align:center;animation:appear .5s cubic-bezier(.3,1.5,.5,1) both}
  .lvwin h2{margin:0 0 6px;font-size:1.6rem;color:#ffd60a;font-weight:800;animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:2px 2px 0 #7a5a00,0 0 0 #fff}to{text-shadow:2px 2px 0 #7a5a00,0 0 18px #ffd60a}}
  .lvwin .heroes{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
  .lvwin .heroes .hm{width:72px;height:86px}
  .lvwin .heroes .arrow{font-size:1.6rem;color:#ffd60a}
  .lvwin .heroes .hm.new{animation:newhero 1s ease-in-out infinite alternate}
  @keyframes newhero{from{filter:drop-shadow(0 0 2px #fff)}to{filter:drop-shadow(0 0 14px #ffd60a)}}
  .lvwin p{margin:6px 0;font-weight:700;line-height:1.6}
  .lvwin .num{color:#ffd60a;font-family:Nunito,sans-serif;font-size:1.5rem}
  .lvwin .items{color:#7fdfff;font-weight:800}
  .lvwin .btn{margin-top:14px;width:100%;background:#fff;color:#1b1b3a}
</style>
</head>
<body>

<header>
  <h1>🎮 小5 英語 復習ドリル <span class="lvb" id="hLv">Lv 1</span></h1>
  <a href="index.html">📖 文法まとめへ</a>
</header>

<main>

<!-- 単元えらび -->
<section id="sel" class="screen on">
  <div class="status">
    <div class="hm" id="sHero"></div>
    <div style="flex:1;min-width:0">
      <div class="lv">Lv <b id="sLv">1</b> ゆうしゃ</div>
      <span class="xpbar"><b id="sXp"></b></span>
      <div class="sm" id="sXpTxt"></div>
      <div class="sm" id="sEq"></div>
      <div class="sm" id="sKills"></div>
      <button type="button" class="rst" id="sReset">はじめから（けいけんちリセット）</button>
    </div>

  function parse(s){
    var parts=[], re=/\[([^\]]+)\]|\{([^}]+)\}/g, m, last=0;
    while((m=re.exec(s))){
      if(m.index>last) parts.push({t:s.slice(last,m.index)});
      parts.push({blank:true, ans:m[1]||m[2], pool:m[1]?'A':'B'});
      last=re.lastIndex;

    return up ? word.charAt(0).toUpperCase()+word.slice(1) : word.charAt(0).toLowerCase()+word.slice(1);

      });
    }catch(e){}
  }

        o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.03);
      });
    }catch(e){}
  }

    function col(c){ return HP[c] || (typeof PAL!=='undefined' && PAL[c]) || c; }
    function Layer(){ var gr=[]; for(var y=0;y<H;y++){ var row=[]; for(var x=0;x<W;x++) row.push(null); gr.push(row); } this.g=gr; this.minY=0; this.extra=[]; }
    Layer.prototype.px=function(x,y,c){ if(x<0||x>=W||y<0||y>=H){ if(c) this.extra.push([x,y,c]); return; } this.g[y][x]=c; };
    Layer.prototype.fill=function(x,y,w,h,c){ for(var j=y;j<y+h;j++) for(var i=x;i<x+w;i++) this.px(i,j,c); };
    Layer.prototype.clear=function(x,y,w,h){ this.fill(x,y,w,h,null); };
    Layer.prototype.box=function(x,y,w,h,c,edge){ this.fill(x,y,w,h,c); this.fill(x,y,w,1,edge); this.fill(x,y+h-1,w,1,edge); this.fill(x,y,1,h,edge); this.fill(x+w-1,y,1,h,edge); };
    Layer.prototype.outline=function(){
      var gr=this.g, add=[];
      for(var y=0;y<H;y++) for(var x=0;x<W;x++){
        if(gr[y][x]) continue;
        if((y>0&&gr[y-1][x])||(y<H-1&&gr[y+1][x])||(x>0&&gr[y][x-1])||(x<W-1&&gr[y][x+1])) add.push([x,y]);
      }
      for(var i=0;i<add.length;i++) gr[add[i][1]][add[i][0]]='K';

      var s='', gr=this.g, open={};

        if(y<H) while(x<W){
          var c=gr[y][x]; if(!c){ x++; continue; }
          var x2=x; while(x2<W && gr[y][x2]===c) x2++;
          runs[x+','+(x2-x)+','+c]=true; x=x2;

        for(var k in open){ if(!runs[k]){ var o=open[k], p=k.split(','); s+='<rect x="'+p[0]+'" y="'+o.y+'" width="'+p[1]+'" height="'+(y-o.y)+'" fill="'+col(p[2])+'"/>'; delete open[k]; } }

  function pixSvg(art,map,flip){
    // 横に続く同じ色のドットは1つの rect にまとめる（高解像度でも軽く描けるように）
    var s='', W=art[0].length, H=art.length;
    for(var y=0;y<H;y++){
      var row=art[y], x=0;
      while(x<row.length){
        var ch=row.charAt(x);
        if(ch==='.'||ch===' '){ x++; continue; }
        var k=(map&&map[ch])?map[ch]:ch, col=PAL[k];
        var x0=x; while(x<row.length && row.charAt(x)===ch) x++;
        if(col) s+='<rect x="'+x0+'" y="'+y+'" width="'+(x-x0)+'" height="1" fill="'+col+'"/>';
      }
    }
    if(flip) s='<g transform="translate('+W+',0) scale(-1,1)">'+s+'</g>';
    return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+s+'</svg>';
  }

  function battleStart(){
    var lv=lvOf(getXp()), m=pickMon(lv); B.mon=m; addSeen(m.id);
    var sp = Math.random()<SP_RATE ? FAMILY[Math.floor(Math.random()*FAMILY.length)] : '';
    B.name = m.name + sp;
    var me=$('mon'); me.className='mon'; me.innerHTML=pixSvg(m.art,m.map,m.flip);
    var h=$('hero').getBoundingClientRect(), r=me.getBoundingClientRect();
    $('scene').style.setProperty('--d', Math.max(40, r.left-h.right+14)+'px');
    anim(me,'appear',450);
    $('mName').textContent=(sp?'★ ':'')+B.name; $('mName').className='mname'+(sp?' sp':'');
    bmsg((sp?'★ ':'')+B.name+'が あらわれた！');
    if(sp) setTimeout(sndSurprise, 200);
    $('bLv').textContent='Lv '+lv+' ゆうしゃ'; $('bXp').style.width=xpPct(getXp())+'%';
  }
  function battleAttack(last){
    var lv=lvOf(getXp()), t=tierOf(lv), hero=$('hero'), mon=$('mon'), sc=$('scene'), c=centerOf('mon'), hitAt;
    if(t===1){ anim(hero,'lunge',600); hitAt=270; }
    else { anim(hero,'swing',550); anim(hero,'step',550); hitAt=300; }
    sndSlash(t);
    bmsg('ゆうしゃの こうげき！');
    setTimeout(function(){
      anim(mon,'hit',450);
      if(t===1){ hitText(c,'ポカッ！'); sparks(c,4); }
      if(t===2){ slashAt(c,-40); hitText(c,'ズバッ！'); sparks(c,6); }
      if(t===3){ slashAt(c,-40); slashAt(c,40,'c2',90); hitText(c,'ズバズバッ！'); sparks(c,12); flashScene(false); }
      if(t===4){ slashAt(c,-40); slashAt(c,40,'c2',80); slashAt(c,0,'c3',160); hitText(c,'ズバババッ！'); sparks(c,18); flashScene(false); anim(sc,'shake',400); }
      if(t===5){ bolt(c,-20,0); bolt(c,18,80); slashAt(c,-40,'c2',60); slashAt(c,40,'c3',130); slashAt(c,0,'',200); slashAt(c,90,'c2',270); hitText(c,'ドゴォォン！！'); sparks(c,28); flashScene(true); anim(sc,'shake3',600); sndThunder(); }
      if(last){ setTimeout(function(){ mon.classList.add('die'); sndDie(); setNum('g5rpg_kills', getNum('g5rpg_kills')+1); bmsg(B.name+'を たおした！'); },380); }
    }, hitAt);
  }
  function battleHurt(){
    var m=B.mon, mon=$('mon'), hero=$('hero'), sc=$('scene');
    anim(mon,'atk',500);
    setTimeout(function(){ anim(hero,'hurt',500); anim(sc,'shake',400); hitText(centerOf('hero'),'いたい！'); },200);
    bmsg(B.name+'の こうげき！ ゆうしゃは ダメージを うけた…');
  }

  /* --- RPGの音 --- */
  function noise(dur, vol, hp, at){
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      var sr=AC.sampleRate, buf=AC.createBuffer(1, Math.floor(sr*dur), sr), d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      var src=AC.createBufferSource(); src.buffer=buf;
      var f=AC.createBiquadFilter(); if(hp>0){ f.type='highpass'; f.frequency.value=hp; } else { f.type='lowpass'; f.frequency.value=300; }
      var g=AC.createGain(), t0=AC.currentTime+(at||0);
      g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t0);
    }catch(e){}
  }
  function sndSlash(t){ noise(0.12+t*0.03, 0.07+t*0.03, 2500, 0.05); if(t>=3) note([N.E6,N.B5],0.1,0.12,'square',0.04); if(t>=4) noise(0.25,0.12,1500,0.2); }
  function sndThunder(){ noise(0.7,0.35,0,0.25); }
  function sndDie(){ note(N.G5,0,0.06,'square',0.07); note(N.E5,0.06,0.06,'square',0.07); note(N.C5,0.12,0.16,'square',0.07); }
  function sndLevelUp(){
    // オリジナルの8bit風ファンファーレ：かけ上がり → 高らかなメロディ → 大きな和音
    var lead=[[N.C5,.07],[N.D5,.07],[N.E5,.07],[N.F5,.07],[N.G5,.07],[N.A5,.07],[N.B5,.07],[N.C6,.28],[0,.05],
              [N.E6,.16],[N.D6,.16],[N.C6,.16],[N.G5,.16],[[N.C6,N.E6],.45],[0,.05],
              [N.G6,.12],[[N.C6,N.E6,N.G6,N.C7],1.2]];
    var len=seq(lead,'square',0.11);
    seq([[0,.56],[N.C4,.16],[N.G4,.16],[N.E4,.16],[N.C4,.16],[[N.C4,N.G4],.45],[0,.05],[N.G4,.12],[[N.C4,N.G4],1.2]],'triangle',0.14);
    return len;
  }
  function showLevelUp(lv0, lv1){
    var g0=gear(lv0), g1=gear(lv1), items=[];
    ['weapon','shield','armor','helm','cape'].forEach(function(k){ if(g1[k] && g1[k]!==g0[k]) items.push('「'+GN[k][g1[k]]+'」'); });
    $('luLv').textContent=lv1; $('luOld').innerHTML=heroSvg(lv0); $('luNew').innerHTML=heroSvg(lv1);
    $('luItems').textContent = items.length ? items.join(' と ')+' を 手に入れた！' : 'さらに 強くなった！';
    $('luMax').style.display = lv1>=LVMAX ? 'block' : 'none';
    $('lvup').classList.add('on');
    sndLevelUp(); confetti(4500);
  }
  $('luOk').addEventListener('click', function(){ $('lvup').classList.remove('on'); });


  var synth = window.speechSynthesis, voice=null, voiceJa=null;
  function pickVoice(){
    if(!synth) return;
    var vs = synth.getVoices(); if(!vs.length) return;
    var pj = ['Kyoko','O-Ren','Google 日本語','Microsoft Nanami','Microsoft Ayumi','Microsoft Haruka','Microsoft Sayaka'];
    voiceJa=null;
    for(var k=0;k<pj.length&&!voiceJa;k++){ var fj=vs.filter(function(v){ return v.name.indexOf(pj[k])===0 && /^ja/i.test(v.lang); }); if(fj.length) voiceJa=fj[0]; }
    if(!voiceJa){ var ja=vs.filter(function(v){ return /^ja/i.test(v.lang); }); voiceJa=ja[0]||null; }
    var prefer = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Daniel'];
    for(var i=0;i<prefer.length;i++){
      var f = vs.filter(function(v){ return v.name.indexOf(prefer[i])===0 && /^en/i.test(v.lang); });
      if(f.length){ voice=f[0]; return; }
    }
    var us = vs.filter(function(v){ return /^en[-_]US/i.test(v.lang); });
    var en = vs.filter(function(v){ return /^en/i.test(v.lang); });
    voice = us[0]||en[0]||null;
  }
  if(synth){ pickVoice(); if(typeof synth.onvoiceschanged!=='undefined') synth.onvoiceschanged=pickVoice; }
  function speak(text){
    if(!synth || !window.SpeechSynthesisUtterance) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/\s*–\s*/g,' ').replace(/\s+/g,' ').trim());
    u.lang='en-US'; u.rate=0.8; u.pitch=1; if(voice) u.voice=voice;
    setTimeout(function(){ synth.speak(u); }, 80);
  }
  function speakJa(text){
    if(!synth || !window.SpeechSynthesisUtterance) return;
    synth.cancel();
    var t = text.replace(/（[^）]*）/g,'').replace(/\s*–\s*/g,'、').replace(/\s+/g,' ').trim();
    var u = new SpeechSynthesisUtterance(t);
    u.lang='ja-JP'; u.rate=1; u.pitch=1; if(voiceJa) u.voice=voiceJa;
    setTimeout(function(){ synth.speak(u); }, 120);
  }

  /* ===== 単元えらび ===== */
  function renderUnits(){
    var box = $('units'); box.innerHTML='';
    UNITS.forEach(function(u){
      var b = document.createElement('button'); b.type='button'; b.className='unit';
      var best = getBest(u.n);
      b.innerHTML = '<span class="num">'+u.n+'</span><span class="t">'+u.title+'</span><span class="s">'+u.sub+'・'+u.items.length+'問</span><span class="best">'+(best===null?'':'ベスト '+best+'点')+'</span>';
      b.addEventListener('click', function(){ start(u); });
      box.appendChild(b);
    });
    renderHeader(); renderStatus(); renderZukan();
  }

  /* ===== ドリル本体 ===== */
  var G = null; // 進行中の状態
  function start(unit, items, review){
    G = { unit:unit, order:shuffle(items||unit.items), i:0, miss:[], missTotal:0, cur:null, review:!!review };
    $('dUnit').innerHTML = '<b>'+unit.n+'</b>'+unit.title+(review?' <small style="color:var(--ok)">おさらい</small>':'');
    $('hero').innerHTML = heroSvg(lvOf(getXp()));
    show('drill');
    nextItem();
  }
  function nextItem(){
    var it = G.order[G.i];
    G.cur = { parts:parse(it[0]), full:plain(it[0]), ja:it[1], bi:0, m:0 };
    G.cur.blanks = G.cur.parts.filter(function(p){ return p.blank; });
    $('dProg').textContent = (G.i+1)+' / '+G.order.length;
    $('dBar').style.width = (G.i/G.order.length*100)+'%';
    $('dJa').innerHTML = '<small>日本語</small>'+G.cur.ja;
    $('dMsg').textContent=''; $('dMsg').className='msg';
    $('dAfter').classList.remove('on');
    renderSentence();
    renderChoices();
    battleStart();
    speakJa(G.cur.ja);
  }
  function renderSentence(){
    var el = $('dSent'); el.innerHTML='';
    var bi=0;
    G.cur.parts.forEach(function(p){
      if(!p.blank){ el.appendChild(document.createTextNode(p.t)); return; }
      var s = document.createElement('span'); s.className='blank';
      var idx = bi++;
      if(idx<G.cur.bi){ s.classList.add('done'); s.textContent=p.ans; }
      else { s.textContent=p.ans; if(idx===G.cur.bi) s.classList.add('cur'); }
      var lab=document.createElement('span'); lab.className='lab'; lab.textContent=G.unit.labels[p.pool]||''; s.appendChild(lab);
      el.appendChild(s);
    });
  }
  function renderChoices(){
    var box=$('dChoices'); box.innerHTML='';
    var blank = G.cur.blanks[G.cur.bi];
    if(!blank){ $('dAsk').innerHTML=''; return; }
    var no = G.cur.bi+1;
    $('dAsk').innerHTML = '<span>'+(G.cur.blanks.length>1?no+'つ目':'')+'</span>'+(G.unit.labels[blank.pool]||'言葉')+' をえらぼう';
    makeChoices(G.unit, blank).forEach(function(w){
      var b=document.createElement('button'); b.type='button'; b.className='ch'; b.textContent=w;
      b.addEventListener('click', function(){ answer(b, w, blank); });
      box.appendChild(b);
    });
  }
  function answer(btn, w, blank){
    if(w===blank.ans){
      btn.classList.add('ok'); sndOk();
      Array.prototype.forEach.call($('dChoices').children, function(c){ c.disabled=true; });
      var last = G.cur.bi+1>=G.cur.blanks.length;
      battleAttack(last);
      G.cur.bi++;
      setTimeout(function(){
        renderSentence();
        if(G.cur.bi>=G.cur.blanks.length){ itemDone(); }
        else { renderChoices(); }
      }, last?900:650);
    }else{
      btn.classList.add('ng'); btn.disabled=true; sndNg();
      battleHurt();
      G.cur.m++;
      $('dMsg').textContent = 'ちがうよ。もう一度えらんでみよう'; $('dMsg').className='msg ng';
    }
  }
  function itemDone(){
    var m=G.cur.m;
    if(m>0){ G.miss.push({en:G.cur.full, m:m}); G.missTotal+=m; }
    $('dMsg').textContent = m===0 ? '🎉 正解！ 一発クリア！' : '⭕ 正解！（まちがい '+m+'回）';
    $('dMsg').className='msg ok';
    $('dChoices').innerHTML=''; $('dAsk').innerHTML='';
    $('dAfter').classList.add('on');
    $('dBar').style.width = ((G.i+1)/G.order.length*100)+'%';
    speak(G.cur.full);
    $('dNext').textContent = (G.i+1>=G.order.length) ? '点数を見る ▶' : 'つぎへ ▶';
    $('dNext').focus();
  }
  $('dSay').addEventListener('click', function(){ if(G&&G.cur) speak(G.cur.full); });
  $('dNext').addEventListener('click', function(){
    G.i++;
    if(G.i>=G.order.length) finish(); else nextItem();
  });
  $('dQuit').addEventListener('click', function(){ if(synth) synth.cancel(); G=null; renderUnits(); show('sel'); });

  /* ===== 結果 ===== */
  function finish(){
    var N=G.order.length, per=100/N, total=0;
    var missMap={}; G.miss.forEach(function(x){ missMap[x.en]=x.m; });
    G.order.forEach(function(it){
      var m = missMap[plain(it[0])]||0;
      total += per*Math.max(0, 1-0.5*m);
    });
    var score = Math.round(total);
    var u=G.unit;
    $('rUnit').textContent = '単元'+u.n+'　'+u.title+(G.review?'（おさらい）':'');
    var missItems = G.order.filter(function(it){ return missMap[plain(it[0])]; });
    G.missItems = missItems;
    $('rReview').hidden = missItems.length===0;
    $('rReview').textContent = '📝 まちがえた文だけおさらい（'+missItems.length+'問）';
    $('rScore').textContent = score;
    var stars = score===100?3 : score>=70?2 : score>=40?1 : 0;
    $('rStars').innerHTML = [1,2,3].map(function(k){ return '<span class="'+(k<=stars?'':'off')+'">★</span>'; }).join('');
    $('rCmt').textContent = score===100 ? 'パーフェクト！すごい！' : score>=80 ? 'とてもよくできました！' : score>=60 ? 'いいかんじ！もう少し！' : 'もう一度チャレンジしてみよう！';
    $('rDetail').textContent = N+'問中 一発クリア '+(N-G.miss.length)+'問・まちがい合計 '+G.missTotal+'回';
    var best=getBest(u.n);
    if(G.review){ $('rBest').innerHTML = best===null ? '' : '<span class="detail">ベスト記録 '+best+'点（おさらいでは更新しません）</span>'; }
    else if(best===null || score>best){ setBest(u.n, score); $('rBest').innerHTML = best===null ? '' : '<span class="newbest">🏆 ベスト記録更新！（前回 '+best+'点）</span>'; }
    else { $('rBest').innerHTML = '<span class="detail">ベスト記録 '+best+'点</span>'; }
    var miss=$('rMiss');
    if(G.miss.length){
      miss.innerHTML = '<h3>まちがえた文（おさらいしよう）</h3><ul>'+G.miss.map(function(x){ return '<li>'+x.en+'<small>まちがい '+x.m+'回</small></li>'; }).join('')+'</ul>';
    } else miss.innerHTML='';
    /* けいけんち（点数ぶん加算）とレベルアップ判定 */
    var xp0=getXp(), lv0=lvOf(xp0), xp1=xp0+score, lv1=lvOf(xp1);
    setXp(xp1); setNum('g5rpg_runs', getNum('g5rpg_runs')+1);
    $('rXp').innerHTML = '<div class="hm">'+heroSvg(lv0)+'</div><div style="flex:1;min-width:0"><div class="g">けいけんち <b>+'+score+'</b>　Lv <span id="rLv">'+lv0+'</span></div><span class="xpbar"><b id="rXpBar" style="width:'+xpPct(xp0)+'%"></b></span><div class="sm" id="rXpTxt">'+xpText(xp0)+'</div></div>';
    setTimeout(function(){
      var bar=$('rXpBar');
      if(lv1>lv0){
        bar.style.width='100%';
        setTimeout(function(){ bar.style.transition='none'; bar.style.width='0%'; void bar.offsetWidth; bar.style.transition=''; bar.style.width=xpPct(xp1)+'%'; $('rLv').textContent=lv1; $('rXpTxt').textContent=xpText(xp1); }, 1000);
      } else { bar.style.width=xpPct(xp1)+'%'; $('rXpTxt').textContent=xpText(xp1); }
    }, 400);
    if(lv1>lv0) setTimeout(function(){ showLevelUp(lv0, lv1); }, stars>=3 ? 5800 : 1900);
    renderHeader();
    show('res');
    if(stars>=3) sndPerfect(); else sndResult(stars);
  }
  $('rAgain').addEventListener('click', function(){ start(G.unit); });
  $('rReview').addEventListener('click', function(){ if(G.missItems && G.missItems.length) start(G.unit, G.missItems, true); });
  $('rOther').addEventListener('click', function(){ G=null; renderUnits(); show('sel'); });

  /* けいけんちのリセット。RESET_VER を変えると、次にページを開いたとき一度だけ全員の記録が 0 に戻る */
  var RESET_VER='2026-10-25b';
  function resetProgress(){ setXp(0); setNum('g5rpg_kills',0); try{ localStorage.removeItem('g5rpg_seen'); }catch(e){} }
  if(getStr('g5rpg_reset')!==RESET_VER){ resetProgress(); setStr('g5rpg_reset',RESET_VER); }
  (function(){
    var b=$('sReset'), armed=false, timer=null;
    b.addEventListener('click', function(){
      if(!armed){ armed=true; b.classList.add('arm'); b.textContent='本当にリセット？（もう一度タップ）'; timer=setTimeout(function(){ armed=false; b.classList.remove('arm'); b.textContent='はじめから（けいけんちリセット）'; },4000); return; }
      clearTimeout(timer); armed=false; b.classList.remove('arm'); b.textContent='はじめから（けいけんちリセット）';
      resetProgress(); renderUnits();
    });
  })();

  renderUnits();
})();
</script>
